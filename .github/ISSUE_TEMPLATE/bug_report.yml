name: Bug report
description: Report a reproducible NIRT ShooterBot problem.
title: "[Bug]: "
labels: [ "needs triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Before filing, run **Generate GitHub Support Report** from the Scripts console when possible.

        The report may contain device, username, path, configuration, and log information. Review and redact it before attaching it if its sensitive.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clearly describe the observed behavior and its impact.
      placeholder: The application closes when...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence of actions and configuration changes.
      placeholder: |
        1. Start with...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Installer/configuration
        - Scripts console
        - Camera/inference
        - Models/downloads
        - Serial/Arduino
        - Logging/support report
        - Other
    validations:
      required: true
  - type: dropdown
    id: bug_area
    attributes:
      label: Bug type
      description: Choose the affected area. Maintainers will apply `bug:core`, `bug:installer`, or `bug:scripts` during triage.
      options:
        - Core runtime / Main script        (bug:core)
        - Installer or configuration        (bug:installer)
        - Scripts console or utility script (bug:scripts)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project commit or version
      description: Run `git rev-parse --short HEAD` from the project directory when available.
      placeholder: abc1234
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, GPU/CUDA details, and whether serial hardware is enabled.
      placeholder: Windows 11, Python 3.11, RTX ..., CUDA ..., simulation mode
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Upload the JSON log created before, and if possible the latest LOG file from the `logs` directory.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I attached the JSON log and agree that all uploaded files can be viewed by anyone checking this issue.
          required: true
