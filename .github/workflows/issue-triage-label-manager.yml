name: Issue response triage

on:
  issue_comment:
    types: [ created ]

permissions:
  issues: write

jobs:
  response-triage:
    runs-on: ubuntu-latest

    steps:
      - name: Update triage label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;

            // Ignore pull requests because issue_comment fires for both
            // issues and pull requests.
            if (issue.pull_request) {
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;

            const commenter = comment.user.login;
            const issueAuthor = issue.user.login;
            const association = comment.author_association;

            const maintainerAssociations = new Set([
              "OWNER",
              "MEMBER",
              "COLLABORATOR",
            ]);

            if (commenter === issueAuthor) {
              // The reporter responded, so maintainer attention is needed again.
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ["needs triage"],
              });

              return;
            }

            if (maintainerAssociations.has(association)) {
              // A maintainer responded, so it no longer needs triage.
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "needs triage",
                });
              } catch (error) {
                // GitHub returns 404 if the label is not currently present.
                if (error.status !== 404) {
                  throw error;
                }
              }
            }